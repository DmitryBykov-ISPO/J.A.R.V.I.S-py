    - выход с игрового режима
    - рабочее пространство
    - вернись в игровой режим
    - выключи игровой режим
  action:
    type: multi
    steps:
      - {type: play_sound, name: ok}
      - {type: exe, file: "Switch back to workspace.exe", wait: true}
      - {type: play_sound, name: ready}

