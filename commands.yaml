sound_off:
  phrases:
    - выключи звук
    - беззвучный режим
    - режим без звука
    - отключи звук
  action:
    type: multi
    steps:
      - {type: play_sound, name: ok}
      - {type: system, op: volume_mute}

sound_on:
  phrases:
    - включи звук
    - режим со звуком
    - верни звук
  action:
    type: multi
    steps:
      - {type: system, op: volume_unmute}
      - {type: play_sound, name: ok}

