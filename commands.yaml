'off':
  phrases:
    - выключись
    - вырубись
    - завершить работу
    - закройся
    - отключись
    - заверши свою работу
    - на сегодня хватит
    - выгрузи себя из памяти
    - ты мне надоел
    - пора спать
  action:
    type: multi
    steps:
      - {type: play_sound, name: "off"}
      - {type: system, op: exit}
